name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — unit, UI and real end-to-end tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libxtst-dev patchelf xvfb xdotool xclip python3-tk dbus-x11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm install --no-audit --no-fund

      - name: Design tokens are in sync
        working-directory: .
        run: node design/build-tokens.mjs --check

      - name: Typecheck + build frontend
        run: npm run build

      - name: Frontend unit tests
        run: npm test

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: UI + landing page tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "1"

      - name: Build desktop binary
        run: npx tauri build --no-bundle

      - name: Real end-to-end test (Xvfb + xdotool)
        run: bash e2e/run.sh src-tauri/target/release/clazy

  other-platforms:
    name: ${{ matrix.os }} — Rust tests
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
