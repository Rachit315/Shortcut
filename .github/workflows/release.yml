name: Release

# Builds installers for macOS (universal), Windows and Linux, then publishes them to a GitHub
# release with *stable file names*, so https://github.com/<repo>/releases/latest/download/<name>
# always points at the newest build (the landing page's /download/* links rely on this).
#
# Run it from the Actions tab ("Run workflow"), push a tag such as v0.1.0, or push a commit
# whose message contains "[release]".
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxtst-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install JS dependencies (also generates app icons)
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build installers
        working-directory: app
        run: npx tauri build ${{ matrix.args }}

      - name: Collect installers with stable names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          T=app/src-tauri/target
          case "${{ runner.os }}" in
            macOS)
              cp $T/universal-apple-darwin/release/bundle/dmg/*.dmg out/Clazy-macos-universal.dmg ;;
            Windows)
              cp $T/release/bundle/nsis/*-setup.exe out/Clazy-windows-x64-setup.exe
              cp $T/release/bundle/msi/*.msi out/Clazy-windows-x64.msi ;;
            Linux)
              cp $T/release/bundle/deb/*.deb out/Clazy-linux-amd64.deb
              cp $T/release/bundle/appimage/*.AppImage out/Clazy-linux-amd64.AppImage ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Clazy v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: out/*
          body: |
            Download the installer for your system:

            | System | File |
            |---|---|
            | macOS 11+ (Apple silicon & Intel) | `Clazy-macos-universal.dmg` |
            | Windows 10/11 | `Clazy-windows-x64-setup.exe` (or `.msi`) |
            | Linux (Ubuntu 22.04+, X11) | `Clazy-linux-amd64.deb` (or `.AppImage`) |

            **First launch**
            - macOS: the app isn't notarized yet — right-click it → Open (or System Settings → Privacy & Security → Open Anyway), then allow Accessibility so it can paste.
            - Windows: if SmartScreen appears, choose "More info → Run anyway".
            - Linux: `sudo apt install ./Clazy-linux-amd64.deb`, then launch "Clazy".

            Checksums are in `SHA256SUMS.txt`.
